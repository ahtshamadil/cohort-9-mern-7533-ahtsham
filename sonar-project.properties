sonar.projectKey=slate-notes
sonar.projectName=Slate Notes App
sonar.projectVersion=1.0

# both halves are analysed as one project, since they are one deliverable
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test
sonar.test.inclusions=backend/test/**/*.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# the prisma client is generated on every install, and migrations are sql that
# prisma wrote - neither is code anybody here maintains
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/src/generated/**,backend/prisma/migrations/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
