sonar.projectKey=slate-notes
sonar.projectName=Slate Notes App
sonar.projectVersion=1.0

# both halves are analysed as one project, since they are one deliverable
sonar.sources=backend/src,frontend/src
# frontend tests sit inside src, so that path is both. the inclusions below
# decide which of its files are tests; everything else stays source
sonar.tests=backend/test,frontend/src
sonar.test.inclusions=backend/test/**/*.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# the prisma client is generated on every install, and migrations are sql that
# prisma wrote - neither is code anybody here maintains
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/src/generated/**,backend/prisma/migrations/**

# neither runner instruments these, so without this they read as 0% covered
sonar.coverage.exclusions=backend/src/index.ts,frontend/src/main.tsx

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
