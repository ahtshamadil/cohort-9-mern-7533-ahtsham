<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The logo mark from src/components/Logo.tsx, redrawn for a 32px tile: the
    slate sits larger in the frame and the strokes are heavier, because the
    proportions that read as a wordmark turn to mush at 16px.

    The colours are the ink-fill, ink-fill-text and accent theme tokens written
    out, since a favicon is its own document and cannot see the page's custom
    properties. Firefox and Safari honour the media query and swap the tile with
    the theme; browsers that do not still get a filled tile carrying its own
    contrast against any chrome.

    Careful with comments in here: this is parsed as XML, so a doubled hyphen
    inside one is a syntax error and the browser silently falls back.
  -->
  <style>
    .tile { fill: #1b1f22; }
    .rule { stroke: #fafaf8; }
    .mark { fill: #a8711a; }

    @media (prefers-color-scheme: dark) {
      .tile { fill: #eceef0; }
      .rule { stroke: #14181b; }
      .mark { fill: #e5a93f; }
    }
  </style>

  <rect class="tile" width="32" height="32" rx="7" />

  <g class="rule" fill="none" stroke-width="2.1" stroke-linecap="round">
    <rect x="7.5" y="7" width="17" height="18" rx="2.5" />
    <!-- the short rule stops clear of the dot: at 16px a hair of a gap between
         the two closes up and the pair reads as one blob -->
    <path d="M11.75 13.1h8.5M11.75 17.3h4.4" />
  </g>

  <circle class="mark" cx="20.25" cy="21" r="1.9" />
</svg>
